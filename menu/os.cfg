# ld65 config: OS.BIN for the EverDrive N8 clone (57344 bytes)
#   0x0000-0x1FFF  CHR (8 KB)
#   0x2000-0x5FFF  unused
#   0x6000-0xDFFF  PRG at CPU $8000-$FFFF (runs from save SRAM $18000)
# CPU RAM: $0200-$02FF BSS, $0400-$05FF sector buffer (menu),
#          $0300-$06FF loader code that runs while the FPGA is reconfigured
#          (copied there at game start, the sector buffer is no longer needed),
#          $0700-$07FF BSS2 (battery saves; must survive until the RAM code
#          is copied)
MEMORY {
    ZP:   start = $0000, size = $0100, type = rw;
    RAM:  start = $0200, size = $0100, type = rw;
    RAMC: start = $0300, size = $0400, type = rw;
    RAM2: start = $0700, size = $0100, type = rw;
    CHR:  start = $0000, size = $2000, file = %O, fill = yes, fillval = $00;
    PAD:  start = $0000, size = $4000, file = %O, fill = yes, fillval = $00;
    PRG:  start = $8000, size = $8000, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = bss;
    BSS2:     load = RAM2, type = bss;
    CHARS:    load = CHR, type = ro;
    CODE:     load = PRG, type = ro;
    RODATA:   load = PRG, type = ro;
    RAMCODE:  load = PRG, run = RAMC, type = ro, define = yes;
    VECTORS:  load = PRG, type = ro, start = $FFFA;
}
