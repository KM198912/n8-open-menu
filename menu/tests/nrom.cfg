# ld65 config for NROM-256 test ROMs (.nes with iNES header)
MEMORY {
    HDR:  start = $0000, size = $0010, file = %O, fill = yes;
    PRG1: start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    PRG2: start = $C000, size = $4000, file = %O, fill = yes, fillval = $FF;
    CHR:  start = $0000, size = $2000, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    HEADER:  load = HDR,  type = ro;
    MARK1:   load = PRG1, type = ro;
    CODE:    load = PRG2, type = ro;
    VECTORS: load = PRG2, type = ro, start = $FFFA;
    CHARS:   load = CHR,  type = ro;
}
