# ld65 config for the VRC6 test ROM (mapper 24, 32 KB PRG, 8 KB CHR).
# The code lives in the last 8 KB: VRC6 maps it fixed at $E000-$FFFF.
MEMORY {
    ZP:   start = $0000, size = $0100, type = rw;
    HDR:  start = $0000, size = $0010, file = %O, fill = yes;
    PRG1: start = $8000, size = $6000, file = %O, fill = yes, fillval = $FF;
    PRG2: start = $E000, size = $2000, file = %O, fill = yes, fillval = $FF;
    CHR:  start = $0000, size = $2000, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    HEADER:   load = HDR,  type = ro;
    CODE:     load = PRG2, type = ro;
    VECTORS:  load = PRG2, type = ro, start = $FFFA;
    CHARS:    load = CHR,  type = ro;
}
